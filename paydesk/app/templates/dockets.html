{% extends 'base.html' %}
{% block kpis %}{{ kpi_bar(view.metrics) }}{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel__head"><h2>{{ view.title }}</h2><span>{{ view.rows|length }} 张票</span></div>
  {{ table(view.rows, meta.labels) }}
  <div class="panel__bar">
    <span class="hint">日结后未付票按现行生效结果入清单；同一票据重复导入会被隔离，不静默覆盖。</span>
  </div>
</section>
{% endblock %}
