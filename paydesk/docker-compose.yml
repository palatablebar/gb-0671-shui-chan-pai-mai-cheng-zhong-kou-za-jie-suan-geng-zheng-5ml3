name: paydesk
services:
  app:
    build: .
    ports:
      - "${PORT:-18241}:8000"
    environment:
      DB_PATH: /data/paydesk.sqlite
      TZ: Asia/Shanghai
    volumes:
      - paydesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  paydesk-data:
